<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ADHD Prioritizer</title>
<style>
  :root {
    --bg: #faf9f7;
    --card: #ffffff;
    --ink: #1f2328;
    --muted: #6b7280;
    --line: #e5e7eb;
    --accent: #6d5ef8;
    --accent-ink: #ffffff;
    --urgent: #d64545;
    --ease: #2f9e6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 760px; margin: 0 auto; padding: 32px 20px 80px; }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  p.sub { color: var(--muted); margin-top: 0; }
  section.card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
  }
  label.field-label { display: block; font-weight: 600; margin-bottom: 8px; }
  textarea {
    width: 100%;
    min-height: 140px;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px;
    font-size: 0.95rem;
    font-family: inherit;
    resize: vertical;
  }
  .hint { color: var(--muted); font-size: 0.85rem; margin-top: 6px; }
  .values-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 8px;
  }
  .value-chip {
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 14px;
    cursor: pointer;
    font-size: 0.9rem;
    user-select: none;
    background: var(--bg);
  }
  .value-chip.selected {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }
  button.primary {
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: 10px;
    padding: 12px 20px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  button.primary:disabled { opacity: 0.6; cursor: default; }
  .task-card {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
    background: var(--card);
  }
  .task-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .task-name { font-weight: 700; font-size: 1.02rem; }
  .badge {
    display: inline-block;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 3px 8px;
    border-radius: 999px;
    background: #efe9ff;
    color: var(--accent);
    font-weight: 700;
    white-space: nowrap;
  }
  .why { margin: 8px 0 2px; }
  .consequence { color: var(--urgent); font-size: 0.92rem; margin: 2px 0 10px; }
  .task-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
  select.time-select {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 0.88rem;
  }
  .score-pill {
    font-size: 0.78rem;
    color: var(--muted);
  }
  a.cal-link {
    font-size: 0.85rem;
    color: var(--accent);
    text-decoration: none;
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 6px 10px;
  }
  #error { color: var(--urgent); margin-top: 10px; display: none; }
  #loading { display: none; color: var(--muted); margin-top: 10px; }
  #results-head { display: flex; justify-content: space-between; align-items: baseline; }
</style>
</head>
<body>
<main>
  <h1>ADHD Prioritizer</h1>
  <p class="sub">Dump your to-do list. Pick what matters to you. Get told what actually needs to happen first — and why.</p>

  <section class="card">
    <label class="field-label" for="tasks">Your to-do list</label>
    <textarea id="tasks" placeholder="One task per line, e.g.&#10;pay mortgage&#10;tidy desk before presentation this afternoon&#10;look up gardening ideas for spring"></textarea>
    <p class="hint">Don't overthink the wording — just get it out of your head.</p>
  </section>

  <section class="card">
    <label class="field-label">What matters most to you right now? (pick any that apply)</label>
    <div class="values-grid" id="values-grid"></div>
    <p class="hint">You're tying tasks to these — it's how the app finds a "why" for the boring ones.</p>
  </section>

  <button class="primary" id="go">Prioritize my list</button>
  <div id="loading">Thinking this through…</div>
  <div id="error"></div>

  <div id="results" style="margin-top:28px;"></div>
</main>

<script>
const VALUES = ["money","reputation","relationship","ease","fun","family","loyalty","health and wellness"];
const EFFORT_WEIGHT = {"<=2min":10,"2-5min":7,"5-30min":4,"30-60min":2,">60min":0};
const TIME_BUCKETS = ["<=2min","2-5min","5-30min","30-60min",">60min"];
const selected = new Set();

const grid = document.getElementById("values-grid");
VALUES.forEach(v => {
  const chip = document.createElement("div");
  chip.className = "value-chip";
  chip.textContent = v;
  chip.onclick = () => {
    chip.classList.toggle("selected");
    if (selected.has(v)) selected.delete(v); else selected.add(v);
  };
  grid.appendChild(chip);
});

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function icsFor(task) {
  const now = new Date();
  let start = task.deadline_date ? new Date(task.deadline_date + "T09:00:00") : new Date(now.getTime() + 24*3600*1000);
  if (isNaN(start.getTime()) || start < now) start = new Date(now.getTime() + 24*3600*1000);
  const durMin = task.time_estimate === ">60min" ? 60 : 30;
  const end = new Date(start.getTime() + durMin*60000);
  const fmt = d => d.toISOString().replace(/[-:]/g,"").split(".")[0] + "Z";
  const summary = `${task.task} — ${task.why}`.replace(/\n/g," ");
  const desc = (task.consequence || "").replace(/\n/g," ");
  const ics = [
    "BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//ADHD Prioritizer//EN","BEGIN:VEVENT",
    `UID:${Date.now()}-${Math.random().toString(36).slice(2)}@adhd-prioritizer`,
    `DTSTAMP:${fmt(now)}`, `DTSTART:${fmt(start)}`, `DTEND:${fmt(end)}`,
    `SUMMARY:${summary}`, `DESCRIPTION:${desc}`,
    "END:VEVENT","END:VCALENDAR"
  ].join("\r\n");
  return new Blob([ics], {type: "text/calendar"});
}

function render(tasks) {
  const results = document.getElementById("results");
  results.innerHTML = "";
  const head = document.createElement("div");
  head.id = "results-head";
  head.innerHTML = `<h2>Your list, in order</h2>`;
  results.appendChild(head);

  tasks.forEach((t, i) => {
    const card = document.createElement("div");
    card.className = "task-card";
    const calBtn = t.needs_calendar
      ? `<a href="#" class="cal-link" data-idx="${i}">Add to calendar</a>`
      : "";
    card.innerHTML = `
      <div class="task-top">
        <div>
          <span class="task-name">${escapeHtml(t.task)}</span>
          <span class="badge">${escapeHtml(t.value)}</span>
        </div>
        <span class="score-pill">score ${t.display_score}</span>
      </div>
      <div class="why">${escapeHtml(t.why)}</div>
      <div class="consequence">If skipped: ${escapeHtml(t.consequence)}</div>
      <div class="task-meta">
        <select class="time-select" data-idx="${i}">
          ${TIME_BUCKETS.map(b => `<option value="${b}" ${b===t.time_estimate?"selected":""}>${b}</option>`).join("")}
        </select>
        ${calBtn}
      </div>
    `;
    results.appendChild(card);
  });

  document.querySelectorAll(".time-select").forEach(sel => {
    sel.onchange = (e) => {
      const idx = +e.target.dataset.idx;
      const t = tasks[idx];
      t.time_estimate = e.target.value;
      t.effort_weight = EFFORT_WEIGHT[t.time_estimate];
      t.display_score = t.total_score + t.effort_weight;
      t.needs_calendar = (t.time_estimate === "30-60min" || t.time_estimate === ">60min");
      tasks.sort((a,b) => b.display_score - a.display_score);
      render(tasks);
    };
  });

  document.querySelectorAll(".cal-link").forEach(link => {
    link.onclick = (e) => {
      e.preventDefault();
      const idx = +e.target.dataset.idx;
      const blob = icsFor(tasks[idx]);
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${tasks[idx].task.slice(0,40).replace(/[^a-z0-9]+/gi,"_")}.ics`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    };
  });
}

document.getElementById("go").onclick = async () => {
  const tasksText = document.getElementById("tasks").value;
  const errorEl = document.getElementById("error");
  const loadingEl = document.getElementById("loading");
  errorEl.style.display = "none";
  document.getElementById("results").innerHTML = "";

  if (!tasksText.trim()) { errorEl.textContent = "Add at least one task."; errorEl.style.display = "block"; return; }
  if (selected.size === 0) { errorEl.textContent = "Pick at least one value first."; errorEl.style.display = "block"; return; }

  loadingEl.style.display = "block";
  document.getElementById("go").disabled = true;
  try {
    const res = await fetch("/api/prioritize", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({tasks: tasksText, values: Array.from(selected)})
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({detail: res.statusText}));
      throw new Error(err.detail || "Something went wrong.");
    }
    const data = await res.json();
    render(data.tasks);
  } catch (e) {
    errorEl.textContent = e.message;
    errorEl.style.display = "block";
  } finally {
    loadingEl.style.display = "none";
    document.getElementById("go").disabled = false;
  }
};
</script>
</body>
</html>
